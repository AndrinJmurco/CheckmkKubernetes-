apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: checkmk
  namespace: checkmk
spec:
  rules:
    # Adapt to your own system.
    - host: monitor.your.cluster
      http:
        paths:
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: checkmk
                port:
                  number: 80
