apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: checkmk
  namespace: checkmk
spec:
  podSelector:
    matchLabels:
      app: checkmk
  # Preserve the original allowed port set and source compatibility.
  # Restrict sources after validating the actual ingress and monitoring topology.
  ingress:
  - ports:
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 5000
    - protocol: TCP
      port: 6556
  policyTypes:
  - Ingress
